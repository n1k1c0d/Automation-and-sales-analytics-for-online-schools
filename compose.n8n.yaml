services:
  report-api:
    build:
      context: .
      dockerfile: workflows/api.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, reports]
    healthcheck:
      test: ["CMD", "/service/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.48.7
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/daily_sales_report.json:/opt/eduflow/daily_sales_report.json:ro
    depends_on:
      report-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [reports]
    restart: unless-stopped

  telegram-delivery:
    image: n8nio/n8n:2.48.7
    entrypoint: ["node", "/opt/eduflow/telegram/server.mjs"]
    network_mode: "service:n8n"
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      EDUFLOW_TELEGRAM_CHAT_ID: ${EDUFLOW_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./workflows/telegram:/opt/eduflow/telegram:ro
      - telegram_delivery_data:/home/node/.n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5687/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  reports: {}

volumes:
  n8n_data:
  telegram_delivery_data:
