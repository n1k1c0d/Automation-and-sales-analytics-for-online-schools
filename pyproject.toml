[project]
name = "eduflow-ai"
version = "0.1.0"
description = "Sales analytics and automation for online schools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1,<2",
    "defusedxml>=0.7,<1",
    "fastapi",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "tzdata",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
